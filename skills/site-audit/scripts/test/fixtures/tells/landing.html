<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Acme platform</title>
  <style>
    .hero__title {
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 900;
    }
    .eyebrow { text-transform: uppercase; letter-spacing: 0.2em; }
    .card { transition: all 0.3s ease; border: 2px dashed #ccc; }
    .card:hover { transform: translateY(-4px) scale(1.05); }
    .btn:focus { outline: none; }
    .btn { box-shadow: 0 0 40px rgba(124, 58, 237, 0.6); }
    .badge { animation: pulse 2s infinite; }
  </style>
</head>
<body>
  <p class="eyebrow">New</p>
  <h1 class="hero__title">Supercharge your workflow 🚀!</h1>
  <h2>Welcome back, John Doe</h2>
  <p>Lorem ipsum dolor sit amet. Our seamless platform helps you leverage data. ✨</p>
  <p>Trusted by 10,000+ teams. Rated 5 stars. Revenue grew +12% this quarter.</p>
  <a class="btn btn--primary" href="/start">Get started.</a>
  <p>For details <a href="/docs">click here</a>.</p>
  <img src="hero.png">
  <img src="logo.png" alt="">
</body>
</html>
