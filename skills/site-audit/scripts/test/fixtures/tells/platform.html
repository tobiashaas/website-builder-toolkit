<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platform rules</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root {
    --text-hero: clamp(1.5rem, 1rem + 6vw, 5rem);
  }
  h1 { font-size: clamp(16px, 5vw, 64px); }
</style>
</head>
<body>
<h1>Opening hours</h1>
<img src="hero.jpg" alt="Shop front on Market Street" width="1200" height="600" loading="lazy" fetchpriority="high">
<img src="map.png" alt="Map" width="400" height="200" data-loading="lazy" data-fetchpriority="high">
<img src="b.png" alt="a > b" width="40" height="40" loading="lazy" fetchpriority="high">
</body>
</html>
